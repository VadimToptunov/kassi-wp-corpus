note: >
  Synthetic. NVD confirms an unauthenticated PHP code injection / RCE (CWE-94, CVSS 3.1 9.8) in Everest
  Forms Pro <= 1.9.12: the Calculation Addon's process_filter() concatenates user-submitted form field
  values into a PHP code string without escaping before passing it to eval(). The exact vulnerable source
  is not quoted verbatim in the public advisory, so a representative reconstruction using a submitted form
  value and eval() is used. version_after is indicative (the advisory links the vendor changelog, not a
  pinned fixed release). Replace with a verbatim excerpt if the diff is obtained.
