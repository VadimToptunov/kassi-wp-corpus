note: >
  Synthetic but faithful: the public advisory states the cause exactly — a front-end controller task
  concatenates a getString() request parameter into the SQL, and Joomla's STRING filter does not escape
  single quotes. JoomCCK is vendor-hosted (JoomCoder), so there is no public release/diff to excerpt
  verbatim; this case reproduces the verified pattern (synthetic: true). Upgrade to a verbatim excerpt
  if the vulnerable release is ever obtained.
